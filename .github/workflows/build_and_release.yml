name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r web/dist/. internal/web/dist/

      - name: Clear Go build cache (force re-embed frontend assets)
        run: go clean -cache

      - name: Build native binary
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-windows.exe ./cmd/copilot-proxy
          elif [ "${{ runner.os }}" = "macOS" ]; then
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-macos ./cmd/copilot-proxy
            chmod +x out/Copilot_Proxy-macos
          else
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-linux ./cmd/copilot-proxy
            chmod +x out/Copilot_Proxy-linux
          fi

      - name: Upload build artifact (executable)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            out/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          ls -la artifacts || true

      - name: Check if this is a pre-release (tag contains "-")
        id: check
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG detected as pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (attach artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "$TAG" artifacts/**/* \
            --generate-notes \
            $PRERELEASE
