name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Copy frontend for Go embed
        run: |
          mkdir -p internal/web/dist
          cp -r web/dist/* internal/web/dist/

      - name: Build native binary
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-windows.exe ./cmd/copilot-proxy
          elif [ "${{ runner.os }}" = "macOS" ]; then
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-macos ./cmd/copilot-proxy
            chmod +x out/Copilot_Proxy-macos
          else
            go build -trimpath -ldflags="-s -w" -o out/Copilot_Proxy-linux ./cmd/copilot-proxy
            chmod +x out/Copilot_Proxy-linux
          fi

      - name: Upload build artifact (executable)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            out/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          ls -la artifacts || true

      - name: Create Release (attach artifacts)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
